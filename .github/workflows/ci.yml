name: CI

on: push

jobs:
  allt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest
      - run: uv run python -m churn.model
